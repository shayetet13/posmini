[package]
name = "posmini"
version = "0.1.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
printers = "2.3.0"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
argon2 = "0.6.0"
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3.34"
qrcode = "0.15.0"
rustybuzz = "0.20.1"
ab_glyph = "0.2.32"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
