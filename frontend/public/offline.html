<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F0E6">
<title>ไม่มีสัญญาณอินเทอร์เน็ต</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#F6F0E6;color:#2A1E16;
    font-family:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;text-align:center}
  main{max-width:360px}
  .mark{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;
    background:linear-gradient(145deg,#E4693A,#BC4C1C);color:#fff;font-size:42px}
  h1{font-size:24px;margin:0 0 8px}
  p{margin:0 0 20px;color:#6B5A4B;line-height:1.55}
  button{min-height:52px;padding:0 28px;border:0;border-radius:14px;font:inherit;font-weight:600;font-size:17px;color:#fff;
    background:linear-gradient(180deg,#E4693A,#D45822);box-shadow:0 8px 18px -8px rgba(217,95,43,.75)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">!</div>
  <h1>ไม่มีสัญญาณอินเทอร์เน็ต</h1>
  <p>ระบบขายต้องเชื่อมต่อกับเซิร์ฟเวอร์ ตรวจสอบ Wi-Fi หรือสัญญาณมือถือ แล้วลองใหม่ ข้อมูลที่บันทึกไว้แล้วไม่หาย</p>
  <button type="button" onclick="location.reload()">ลองใหม่</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
