<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POS">
<meta name="theme-color" content="#F6F0E6">
<meta name="format-detection" content="telephone=no">
<title>ขายหน้าร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="app fixed" data-tab="menu">
<div id="nav" data-active="pos"></div>
<div class="main">
  <header class="mhead">
    <div class="mtitle">
      <h1>ขายหน้าร้าน</h1>
      <p class="muted" id="today" data-shop></p>
    </div>
    <div class="mactions">
      <button class="pill" id="screens" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        จอลูกค้า <span class="dstat off" id="dstat" title="ยังไม่มีจอลูกค้าเชื่อมต่อ">○</span>
      </button>
      <button class="pill" id="stationPill" type="button" hidden></button>
      <button class="pill" id="soldout" type="button">เมนูหมด</button>
      <button class="pill" id="snd" type="button"></button>
    </div>
  </header>

  <div class="paybanner" id="paybanner" role="alert" hidden></div>
  <div class="offlinebar" id="offlinebar" role="status" hidden></div>

  <nav class="tabs" aria-label="หน้าจอ">
    <button class="tab on" data-tab="menu" type="button">เมนู</button>
    <button class="tab" id="tabCartBtn" data-tab="cart" type="button" hidden>ตะกร้า <span id="tabCart"></span></button>
    <button class="tab" data-tab="queue" type="button">คิว <span id="tabQueue"></span></button>
  </nav>

  <div class="pos-body">
    <section class="pos-menu" id="menu" aria-label="เมนูสินค้า">
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid">
        <div class="tile sk-tile" aria-hidden="true"><span class="sk sk-pic"></span><div class="tbody"><span class="sk sk-line" style="width:72%"></span><span class="sk sk-line" style="width:38%"></span></div></div>
        <div class="tile sk-tile" aria-hidden="true"><span class="sk sk-pic"></span><div class="tbody"><span class="sk sk-line" style="width:72%"></span><span class="sk sk-line" style="width:38%"></span></div></div>
        <div class="tile sk-tile" aria-hidden="true"><span class="sk sk-pic"></span><div class="tbody"><span class="sk sk-line" style="width:72%"></span><span class="sk sk-line" style="width:38%"></span></div></div>
        <div class="tile sk-tile" aria-hidden="true"><span class="sk sk-pic"></span><div class="tbody"><span class="sk sk-line" style="width:72%"></span><span class="sk sk-line" style="width:38%"></span></div></div>
        <div class="tile sk-tile" aria-hidden="true"><span class="sk sk-pic"></span><div class="tbody"><span class="sk sk-line" style="width:72%"></span><span class="sk sk-line" style="width:38%"></span></div></div>
        <div class="tile sk-tile" aria-hidden="true"><span class="sk sk-pic"></span><div class="tbody"><span class="sk sk-line" style="width:72%"></span><span class="sk sk-line" style="width:38%"></span></div></div>
      </div>
    </section>

    <aside class="pos-side">
      <section class="panel ticket" id="cart" aria-label="ตะกร้า">
        <div class="panel-head">
          <h2>ออเดอร์ปัจจุบัน</h2>
          <button class="btn ghost small" id="clear" type="button">ล้างตะกร้า</button>
        </div>
        <div class="lines" id="lines"></div>
        <div class="perf"></div>
        <div class="foot">
          <div class="cart-extras" id="extras"></div>
          <div class="total"><span class="muted">รวมทั้งหมด</span><b class="num" id="sum">฿0</b></div>
          <div class="pay-row">
            <button class="btn ok lg" id="payCash" type="button">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
              เงินสด
            </button>
            <button class="btn primary lg" id="payQr" type="button">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/></svg>
              QR พร้อมเพย์
            </button>
          </div>
        </div>
      </section>

      <section class="panel" id="queue" aria-label="คิว">
        <div class="panel-head">
          <h2>คิววันนี้ <span class="muted" id="qcount"></span></h2>
          <div id="qnext"></div>
        </div>
        <div id="printq"></div>
        <div class="panel-body" id="qlist">
          <div class="qcard sk-card" aria-hidden="true"><span class="sk sk-line" style="width:42%;height:22px"></span><span class="sk sk-line" style="width:88%"></span><span class="sk sk-line" style="width:64%"></span></div>
          <div class="qcard sk-card" aria-hidden="true"><span class="sk sk-line" style="width:42%;height:22px"></span><span class="sk sk-line" style="width:88%"></span><span class="sk sk-line" style="width:64%"></span></div>
        </div>
      </section>
    </aside>
  </div>

  <div class="cartbar">
    <div class="total"><span class="muted" id="barCount">0 รายการ</span><b class="num" id="barSum">฿0</b></div>
    <button class="btn primary" id="toCart" type="button">ดูตะกร้า</button>
  </div>
</div>

<div class="modal" id="paymodal" role="dialog" aria-modal="true" aria-label="รับชำระเงิน"><div class="sheet" id="paybox"></div></div>
<div class="modal" id="scrmodal" role="dialog" aria-modal="true" aria-label="จอลูกค้าและ QR สั่งเอง"><div class="sheet" id="scrbox"></div></div>

<script src="/shop.js"></script>
<script src="/static/common.js"></script>
<script src="/static/calc.js"></script>
<script src="/static/cartmath.js"></script>
<script src="/static/offlineq.js"></script>
<script src="/static/station.js"></script>
<script src="/static/pos.js"></script>
</body>
</html>
